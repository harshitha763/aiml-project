services:
  # ── Single combined service: FastAPI backend + served React SPA ───────────
  # One service serves the API (/api/*) and the built frontend (everything
  # else falls back to index.html for client-side routing). Same origin means
  # no CORS, no second service, and no subdomain collisions.
  - type: web
    name: intellimeet-api
    runtime: python
    rootDir: backend
    buildCommand: cd ../frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./intellimeet.db
      - key: UPLOAD_DIR
        value: ./storage/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      # Same-origin (frontend served by this service), so CORS only needs to
      # allow the local dev server.
      - key: BACKEND_CORS_ORIGINS
        value: '["http://localhost:5173"]'
      - key: OPENAI_API_KEY
        value: ""
      - key: GROQ_API_KEY
        value: ""
