services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: intellimeet-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./intellimeet.db
      - key: UPLOAD_DIR
        value: ./storage/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://intellimeet-app.onrender.com","http://localhost:5173"]'
      - key: OPENAI_API_KEY
        value: ""
      - key: GROQ_API_KEY
        value: ""

  # ── Frontend ──────────────────────────────────────────────────────────────
  - type: web
    name: intellimeet-app
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://intellimeet-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
