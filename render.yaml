services:
  # ── Backend API ──────────────────────────────────────────────────────────
  - type: web
    name: intellimeet-api-h763
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///./intellimeet.db
      - key: UPLOAD_DIR
        value: ./storage/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://intellimeet-app-h763.onrender.com","http://localhost:5173"]'
      - key: OPENAI_API_KEY
        value: ""
      - key: GROQ_API_KEY
        value: ""

  # ── Frontend (static SPA) ──────────────────────────────────────────────────
  # Render requires `runtime: static` for static sites (not `node`).
  # Unique name (-h763) avoids global subdomain collisions and the
  # cannot-flip-runtime-in-place limitation.
  - type: web
    name: intellimeet-app-h763
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://intellimeet-api-h763.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
